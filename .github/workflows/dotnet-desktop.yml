name: mpvnet build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
      - 'src/Extensions/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
      - 'src/Extensions/**'

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >
            base-devel
            wget
            p7zip

      - name: Restore NuGet packages
        shell: cmd
        run: |
          cd src
          nuget restore
        working-directory: src

      - name: Build Solution (Debug)
        shell: cmd
        run: |
          msbuild MpvNet.sln /m /p:Configuration=Debug /p:Platform="Any CPU"
        working-directory: src

      - name: Install Gettext.Tools for localization
        shell: pwsh
        run: |
          if (-not (Test-Path "nuget.exe")) {
            Write-Host "Downloading nuget.exe..."
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "nuget.exe"
          }
          if (-not (Test-Path "tools")) {
            New-Item -ItemType Directory -Path "tools" | Out-Null
          }
          Write-Host "Installing Gettext.Tools..."
          .\nuget.exe install Gettext.Tools -OutputDirectory ./tools -ExcludeVersion -NonInteractive
          $msgfmtExe = "$PWD\tools\Gettext.Tools\tools\bin\msgfmt.exe"
          if (Test-Path $msgfmtExe) {
            Write-Host "✅ msgfmt.exe installed at: $msgfmtExe"
          } else {
            Write-Error "❌ Failed to install Gettext.Tools or msgfmt.exe not found!"
            exit 1
          }

      - name: Generate .mo files using msgfmt.exe (inline)
        shell: pwsh
        run: |
          $poDir = "lang"
          $msgfmtExe = "$PWD\tools\Gettext.Tools\tools\bin\msgfmt.exe"
          if (-not (Test-Path $msgfmtExe)) {
            Write-Error "msgfmt.exe not found at $msgfmtExe"
            exit 1
          }
          $poFiles = Get-ChildItem $poDir -Filter *.po -ErrorAction SilentlyContinue
          if ($null -eq $poFiles -or $poFiles.Count -eq 0) {
            Write-Warning "No .po files found in $poDir"
            exit 0
          }
          foreach ($poFile in $poFiles) {
            $lang = $poFile.BaseName
            $moDir = "$poDir\$lang\LC_MESSAGES"
            $moPath = "$moDir\mpvnet.mo"
            if (-not (Test-Path $moDir)) {
              New-Item -ItemType Directory -Path $moDir -Force | Out-Null
            }
            Write-Host "Compiling '$($poFile.Name)' -> '$moPath'"
            & $msgfmtExe --output-file="$moPath" $poFile.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to compile $($poFile.Name)"
              exit 1
            } else {
              Write-Host "✅ Generated $moPath"
            }
          }

      - name: Download libmpv (official mpv v0.42.0)
        shell: msys2 {0}
        run: |
          wget -nv -O mpv.7z https://github.com/mpv-player/mpv/releases/download/v0.42.0/mpv-v0.42.0-x86_64-w64-mingw32-full.zip
          7z x -y mpv.7z -ompvbuild
          find mpvbuild -name '*.dll' -exec cp -f {} src/MpvNet.Windows/bin/Debug/ \;

      - name: Download MediaInfo
        shell: msys2 {0}
        run: |
          wget -nv -O MediaInfo.7z https://mediaarea.net/download/binary/libmediainfo0/24.03/MediaInfo_DLL_24.03_Windows_x64_WithoutInstaller.7z
          7z x -y MediaInfo.7z -oMediaInfo
          cp -f MediaInfo/MediaInfo.dll src/MpvNet.Windows/bin/Debug/MediaInfo.dll || echo "MediaInfo copy skipped"

      - name: Download mpvnet.com
        shell: msys2 {0}
        run: |
          wget -nv -O mpvnet.com https://github.com/mpvnet-player/file-host/releases/download/tag/mpvnet.com.txt
          cp -f mpvnet.com src/MpvNet.Windows/bin/Debug/mpvnet.com || echo "mpvnet.com copy skipped"

      - name: Upload Artifact (framework-dependent)
        uses: actions/upload-artifact@v4
        with:
          name: mpv.net-win64
          path: src/MpvNet.Windows/bin/Debug/
          if-no-files-found: warn

      - name: Self-contained publish (win-x64)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proj = "src/MpvNet.Windows/MpvNet.Windows.csproj"
          dotnet publish $proj -c Debug -r win-x64 --self-contained true -p:PublishSingleFile=true
          $pub = "src/MpvNet.Windows/bin/Debug/win-x64/publish"
          if (Test-Path $pub) {
            Copy-Item "src/MpvNet.Windows/bin/Debug/*.dll" $pub -Force
            Write-Host "Copied native DLLs into self-contained publish folder."
          } else {
            Write-Warning "Publish folder not found: $pub"
          }

      - name: Upload Artifact (self-contained)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mpv.net-win64-selfcontained
          path: src/MpvNet.Windows/bin/Debug/win-x64/publish/
          if-no-files-found: warn
